<!doctype html>
<meta charset="utf-8">
<title>Reborn Office Runtime Acceptance v8 trace</title>
<style>#view-fixture{width:800px;height:600px;position:fixed;left:-2000px;top:0;overflow:hidden}</style>
<pre id="result" data-status="running">starting</pre>
<script src="./row-office-client.js"></script>
<script src="./row-office-view.js"></script>
<script>
'use strict';
(async()=>{
  const out=document.getElementById('result'),log=[]; let client,view,heartbeat=0;
  const rec=(name,value)=>{log.push({name,value});out.textContent=JSON.stringify({status:'running',log},null,2)};
  const ok=(c,m)=>{if(!c)throw new Error(m)};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function wait(fn,msg,timeout=12000){const end=performance.now()+timeout;while(performance.now()<end){const v=await fn();if(v)return v;await sleep(40)}throw new Error(msg)}
  async function report(x){try{await fetch('/__row_result__',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(x)})}catch(_){}}
  async function trace(stage,extra={}){
    const d=view&&view.debugState?view.debugState:{};
    const snap={stage,t:Math.round(performance.now()),q:d.commitsQueued,ok:d.commitsOk,err:d.commitsError,workerPhase:d.workerPhase,workerCommand:d.workerCommand,workerId:d.workerId,active:view?view.active:null,...extra};
    try{await fetch('/__row_trace__',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(snap)})}catch(_){}
  }
  heartbeat=setInterval(()=>{trace('heartbeat')},500);
  try{
    await trace('boot');
    client=new RowOfficeClient('./row-office-worker-loader.js');
    const ready=await client.ready; await trace('ready',{lok:ready.lokBridge,shared:ready.sharedMemory}); rec('ready',ready); ok(ready.lokBridge&&ready.sharedMemory===false,'runtime contract failed');
    const marker='你好 Reborn Office WASM ✓';
    await trace('odt-start');
    const odt=await client.roundTrip('odt',marker+' ODT'); await trace('odt-end'); rec('odt-roundtrip',{pass:odt.pass,bytes:odt.byteLength}); ok(odt.pass,'ODT failed');
    await trace('docx-start');
    const docx=await client.roundTrip('docx',marker+' DOCX'); await trace('docx-end'); rec('docx-roundtrip',{pass:docx.pass,bytes:docx.byteLength}); ok(docx.pass,'DOCX failed');

    await trace('worker-stress-new-start');
    await client.newWriter(); await trace('worker-stress-new-end');
    const workerStress='abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    for(const ch of workerStress) await client.postTextInput(ch);
    await trace('worker-stress-text-end');
    ok((await client.readText()).text===workerStress,'worker committed-text path lost sustained input'); await trace('worker-stress-read-end');
    rec('sustained-worker-input',{length:workerStress.length});

    await trace('view-new-start');
    await client.newWriter(); await trace('view-new-end');
    const fixture=document.createElement('div');fixture.id='view-fixture';document.body.appendChild(fixture);
    view=new RowOfficeCanvasView(client,fixture,{tileCss:256});
    await trace('view-mount-start');
    await view.mount(); await trace('view-mount-end');
    ok(view.pageLayer.firstElementChild,'blank Writer page backdrop missing');
    ok(!fixture.querySelector('canvas[data-row-tile]'),'blank Writer rendered a tile before first commit');
    ok(view.inputFrame&&view.inputWindow&&view.ime,'isolated input frame missing');
    rec('isolated-input-frame',{frameTag:view.inputFrame.tagName,innerTag:view.ime.tagName});

    const page=view.pageLayer.firstElementChild.getBoundingClientRect();
    const target=document.elementFromPoint(page.left+80,page.top+80)||view.documentLayer;
    target.dispatchEvent(new PointerEvent('pointerdown',{pointerId:17,pointerType:'mouse',button:0,buttons:1,clientX:page.left+80,clientY:page.top+80,bubbles:true,cancelable:true}));
    target.dispatchEvent(new PointerEvent('pointerup',{pointerId:17,pointerType:'mouse',button:0,buttons:0,clientX:page.left+80,clientY:page.top+80,bubbles:true,cancelable:true}));
    await wait(()=>document.activeElement===view.inputFrame&&view.inputFrame.contentDocument.activeElement===view.ime,'input frame never focused',3000); await trace('writer-focused');

    function nativeCommit(text){
      const before=new InputEvent('beforeinput',{inputType:'insertText',data:text,bubbles:true,cancelable:true});
      view.ime.dispatchEvent(before); ok(!before.defaultPrevented,'native insertText beforeinput was cancelled');
      view.ime.value+=text;
      view.ime.dispatchEvent(new InputEvent('input',{inputType:'insertText',data:text,bubbles:true}));
    }

    const t0=performance.now(); nativeCommit('A'); await trace('first-input-posted');
    await wait(async()=>{const t=(await client.readText()).text;return t==='A'?t:''},'first Writer commit was blocked before initial tile paint',5000); await trace('first-input-ok');
    rec('first-input-before-tile',{text:'A',milliseconds:Math.round(performance.now()-t0)});
    await wait(()=>fixture.querySelector('canvas[data-row-tile]'),'Writer tile missing after first text commit',12000); await trace('first-tile-visible');
    rec('first-tile-after-input',{ok:true});

    const nativeStress='native-input-abcdefghijklmnopqrstuvwxyz-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    nativeCommit(nativeStress); await trace('native-stress-posted',{len:nativeStress.length});
    const expected='A'+nativeStress;
    const nativeText=await wait(async()=>{const t=(await client.readText()).text;return t===expected?t:''},'native textarea lifecycle stalled',15000); await trace('native-stress-text-ok');
    await wait(()=>view.debugState.commitsOk===view.debugState.commitsQueued,'posted commits did not drain',5000); await trace('native-stress-drained');
    rec('native-textarea-sustained',{length:nativeText.length,queued:view.debugState.commitsQueued,ok:view.debugState.commitsOk});

    const sink=document.createElement('button');sink.id='host-focus-sink';sink.textContent='host-action';let hostClicks=0;sink.addEventListener('click',()=>hostClicks++);document.body.appendChild(sink);
    sink.focus();sink.click(); await trace('host-clicked',{hostClicks});
    await sleep(700); await trace('host-after-700',{hostClicks,activeTag:document.activeElement&&document.activeElement.tagName,activeId:document.activeElement&&document.activeElement.id});
    ok(document.activeElement===sink,'Writer stole focus back from host control');ok(hostClicks===1,'host control click did not complete');ok(view.active===false,'Writer remained active after host focus change');
    rec('host-focus-respected',{hostClicks,active:view.active});

    view.focus(); await trace('explicit-refocus-called');
    await wait(()=>document.activeElement===view.inputFrame&&view.inputFrame.contentDocument.activeElement===view.ime,'explicit Writer refocus failed',3000); await trace('explicit-refocus-ok');
    nativeCommit('Z'); await trace('refocus-z-posted');
    await wait(async()=>{const t=(await client.readText()).text;return t.endsWith('Z')?t:''},'typing failed after explicit Writer refocus'); await trace('refocus-z-ok');
    rec('explicit-refocus-input',{ok:true});

    function compositionCommit(text){
      view.ime.dispatchEvent(new CompositionEvent('compositionstart',{data:'',bubbles:true}));
      view.ime.value=text;
      view.ime.dispatchEvent(new InputEvent('input',{inputType:'insertCompositionText',data:text,bubbles:true}));
      view.ime.dispatchEvent(new CompositionEvent('compositionend',{data:text,bubbles:true}));
      view.ime.dispatchEvent(new InputEvent('input',{inputType:'insertText',data:text,bubbles:true}));
    }
    for(const c of ['你','好','连','续','输','入']){compositionCommit(c);await sleep(20)} await trace('ime-posted');
    const imeText=await wait(async()=>{const t=(await client.readText()).text;return t.endsWith('你好连续输入')?t:''},'repeated native composition stalled',12000); await trace('ime-ok');
    rec('repeated-native-ime',{tail:imeText.slice(-12)});

    let selectionCalls=0;const orig=client.setLokTextSelection.bind(client);client.setLokTextSelection=(...a)=>{selectionCalls++;return orig(...a)};
    const doc=view.documentLayer.getBoundingClientRect(),outsideX=page.left+40,outsideY=Math.max(doc.top+1,page.top-8);const outside=document.elementFromPoint(outsideX,outsideY)||view.documentLayer;
    outside.dispatchEvent(new PointerEvent('pointerdown',{pointerId:18,pointerType:'mouse',button:0,buttons:1,clientX:outsideX,clientY:outsideY,bubbles:true,cancelable:true}));outside.dispatchEvent(new PointerEvent('pointerup',{pointerId:18,pointerType:'mouse',button:0,buttons:0,clientX:outsideX,clientY:outsideY,bubbles:true,cancelable:true}));
    await sleep(120);ok(selectionCalls===0,'outside-page click reached selection backend');rec('outside-page-guard',{backendSelectionCalls:selectionCalls}); await trace('outside-guard-ok');

    view.destroy();view=null;const result={status:'pass',marker,log};out.dataset.status='pass';out.textContent=JSON.stringify(result,null,2);document.title='ROW_ACCEPTANCE_PASS';await trace('pass');await report(result);
  }catch(error){await trace('fail',{message:error?.message||String(error)});const result={status:'fail',message:error?.message||String(error),stack:error?.stack||'',log};out.dataset.status='fail';out.textContent=JSON.stringify(result,null,2);document.title='ROW_ACCEPTANCE_FAIL';await report(result)}finally{if(heartbeat)clearInterval(heartbeat);if(view)view.destroy();if(client)client.terminate()}
})();
</script>
