name: Stage Reborn Office product fixes

on:
  workflow_dispatch:
  push:
    branches: [row-office-runtime-probe]
    paths:
      - '.github/workflows/row-office-stage-product-fixes.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product staging branch
        uses: actions/checkout@v4
        with:
          ref: row-office-product-fixes
          path: product
          fetch-depth: 0

      - name: Checkout diagnostic tooling
        uses: actions/checkout@v4
        with:
          ref: row-office-runtime-probe
          path: tooling
          fetch-depth: 1

      - name: Apply evidence-driven runtime fixes
        run: python3 tooling/diagnostics/stage_product_fixes.py product

      - name: Validate staged product patch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check row-office-browser/row-office-view.js
          node --check row-office-browser/row-office-client.js
          bash -n row-office-browser/run-acceptance.sh
          grep -q '__row_result__' row-office-browser/acceptance.html
          grep -q 'width: tile.cssWidth' row-office-browser/row-office-view.js
          grep -q 'event.button === 1) return 4' row-office-browser/row-office-view.js
          grep -q 'event.button === 2) return 2' row-office-browser/row-office-view.js
          ! grep -q -- '--virtual-time-budget' row-office-browser/run-acceptance.sh
          grep -q 'row-office-runtime-diagnostics' .github/workflows/row-office-core-port.yml
          git diff --stat

      - name: Export staged workflow files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staged-workflows
          mkdir -p staged-workflows
          cp product/.github/workflows/row-office-browser-smoke.yml staged-workflows/
          cp product/.github/workflows/row-office-core-port.yml staged-workflows/

      - name: Upload staged workflow files
        uses: actions/upload-artifact@v4
        with:
          name: row-office-staged-workflows
          retention-days: 7
          if-no-files-found: error
          path: staged-workflows/

      - name: Commit ordinary product files
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ROW Runtime Fix Bot'
          git config user.email 'row-runtime-fix@users.noreply.github.com'
          git restore -- \
            .github/workflows/row-office-browser-smoke.yml \
            .github/workflows/row-office-core-port.yml
          git add \
            row-office-browser/acceptance.html \
            row-office-browser/run-acceptance.sh \
            row-office-browser/row-office-view.js
          git commit -m 'Use wall-clock Writer acceptance and harden canvas input'
          git push origin HEAD:row-office-product-fixes
          echo "STAGED_COMMIT=$(git rev-parse HEAD)"
