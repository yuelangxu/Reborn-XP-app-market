name: Reborn Office final reuse gate

on:
  workflow_dispatch:
  push:
    branches: [row-office-runtime-probe]
    paths:
      - '.github/workflows/row-office-final-reuse-gate.yml'

permissions:
  contents: read
  actions: read

jobs:
  package-proven-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout final product harness
        uses: actions/checkout@v4
        with:
          ref: 9262ba897acaaaf112dc9c37268848d71418dbba
          path: product
          fetch-depth: 1

      - name: Download proven Run 28 runtime
        uses: actions/download-artifact@v4
        with:
          name: row-office-core-port-evidence
          path: evidence
          github-token: ${{ github.token }}
          run-id: 35040735653

      - name: Assemble current browser layer over proven core
        shell: bash
        run: |
          set -euo pipefail
          wasm=$(find evidence -type f -path '*/ROW-browser-runtime/runtime/soffice.wasm' -print -quit)
          test -n "$wasm"
          old_root=$(dirname "$(dirname "$wasm")")
          rm -rf current-runtime final-release-a final-release-b
          cp -a "$old_root" current-runtime

          for file in \
            acceptance.html \
            row-office-client.js \
            row-office-view.js \
            row-office-worker-loader.js \
            row-office-thread.js \
            reborn-office.js; do
            cp "product/row-office-browser/$file" "current-runtime/$file"
          done

          test -s current-runtime/runtime/soffice.js
          test -s current-runtime/runtime/soffice.wasm
          test -s current-runtime/runtime/soffice.data
          test -s current-runtime/runtime/soffice.data.js.metadata
          test -s current-runtime/vendor/zeta.js
          echo '--- current runtime sizes ---'
          ls -lh current-runtime/runtime/soffice.* current-runtime/vendor/zeta.js

      - name: Run final wall-clock browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          ROW_ACCEPTANCE_TIMEOUT_SECONDS=180 \
            bash product/row-office-browser/run-acceptance.sh current-runtime
          cat current-runtime/row-acceptance-result.json
          test -s current-runtime/row-acceptance-result.json
          test -s current-runtime/row-acceptance-http.log

      - name: Build same real runtime twice and require identical ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-release-a final-release-b
          for out in final-release-a final-release-b; do
            python3 product/row-office-browser/build-reborn-package-v2.py \
              current-runtime "$out" \
              --source-sha 9262ba897acaaaf112dc9c37268848d71418dbba \
              --accepted
          done
          sha_a=$(sha256sum final-release-a/RebornOfficeWasm-browser-native.zip | awk '{print $1}')
          sha_b=$(sha256sum final-release-b/RebornOfficeWasm-browser-native.zip | awk '{print $1}')
          echo "package A: $sha_a"
          echo "package B: $sha_b"
          test "$sha_a" = "$sha_b"
          cmp -s \
            final-release-a/RebornOfficeWasm-browser-native.zip \
            final-release-b/RebornOfficeWasm-browser-native.zip
          sha256sum final-release-a/RebornOfficeWasm-browser-native.zip \
            > final-release-a/RebornOfficeWasm-browser-native.zip.sha256

      - name: Verify deterministic ZIP structure and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, zipfile
          from pathlib import PurePosixPath
          path = 'final-release-a/RebornOfficeWasm-browser-native.zip'
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad is not None:
                  raise SystemExit(f'CRC failure: {bad}')
              names = z.namelist()
              transient = [n for n in names if PurePosixPath(n).name.startswith('row-acceptance-')]
              if transient:
                  raise SystemExit('transient acceptance diagnostics leaked into release: ' + ', '.join(transient))
              required = [
                  'RebornOfficeWasm/',
                  'RebornOfficeWasm/runtime/',
                  'RebornOfficeWasm/vendor/',
                  'RebornOfficeWasm/runtime/soffice.js',
                  'RebornOfficeWasm/runtime/soffice.wasm',
                  'RebornOfficeWasm/runtime/soffice.data',
                  'RebornOfficeWasm/runtime/soffice.data.js.metadata',
                  'RebornOfficeWasm/vendor/zeta.js',
                  'RebornOfficeWasm/release.json',
                  'RebornOfficeWasm/IMPORT-MANIFEST.json',
                  'RebornOfficeWasm/SHA256SUMS.txt',
              ]
              for item in required:
                  if item not in names:
                      raise SystemExit(f'missing ZIP member: {item}')
              positions = {name: i for i, name in enumerate(names)}
              for name in names:
                  if name.endswith('/'):
                      continue
                  parent = str(PurePosixPath(name).parent) + '/'
                  if parent != './' and parent in positions and positions[parent] > positions[name]:
                      raise SystemExit(f'parent after child: {parent} > {name}')
              release = json.loads(z.read('RebornOfficeWasm/release.json'))
              if not release.get('browserAcceptancePassed'):
                  raise SystemExit('release.json does not record browser acceptance')
              if release.get('sourceCommit') != '9262ba897acaaaf112dc9c37268848d71418dbba':
                  raise SystemExit(f'unexpected sourceCommit: {release.get("sourceCommit")}')
              if release.get('sharedMemoryRequired') is not False:
                  raise SystemExit('release.json unexpectedly requires shared memory')
              if release.get('nativeBackendRequired') is not False:
                  raise SystemExit('release.json unexpectedly requires a native backend')
              info = z.getinfo('RebornOfficeWasm/runtime/soffice.wasm')
              if info.file_size < 100_000_000:
                  raise SystemExit(f'implausibly small soffice.wasm: {info.file_size}')
              print(json.dumps({
                  'members': len(names),
                  'wasmBytes': info.file_size,
                  'sourceCommit': release.get('sourceCommit'),
                  'browserAcceptancePassed': release.get('browserAcceptancePassed'),
                  'sharedMemoryRequired': release.get('sharedMemoryRequired'),
                  'transientAcceptanceMembers': transient,
              }, indent=2))
          PY

      - name: Upload deterministic final candidate
        uses: actions/upload-artifact@v4
        with:
          name: RebornOfficeWasm-browser-native-deterministic-final
          retention-days: 30
          if-no-files-found: error
          path: |
            final-release-a/RebornOfficeWasm-browser-native.zip
            final-release-a/RebornOfficeWasm-browser-native.zip.sha256
            current-runtime/row-acceptance-result.json
            current-runtime/row-acceptance-chrome.log
            current-runtime/row-acceptance-http.log
