name: Reborn Office browser bridge smoke

on:
  workflow_dispatch:
  push:
    branches: [row-office-core-port, row-office-core-port-prep]
    paths:
      - '.github/workflows/row-office-browser-smoke.yml'
      - 'row-office-browser/**'
      - 'row-office-lok/**'
      - 'row-office-port/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Checkout pinned LibreOffice source for transform smoke
        uses: actions/checkout@v4
        with:
          repository: LibreOffice/core
          ref: 31eabe1e534a70a2b7d5c39eb31e56a75c17be3b
          path: lo-transform-smoke
          fetch-depth: 1

      - name: Script syntax and VFS durability
        run: |
          set -euo pipefail
          node --check row-office-browser/row-office-client.js
          node --check row-office-browser/row-office-worker-loader.js
          node --check row-office-browser/row-office-thread.js
          node --check row-office-browser/row-office-view.js
          node --check row-office-browser/reborn-office.js
          node row-office-browser/test-reborn-vfs-save.js
          bash -n row-office-browser/prepare-runtime-tree.sh
          bash -n row-office-lok/prepare_cjk_font.sh
          bash -n row-office-port/build.sh
          python3 -m py_compile row-office-lok/integrate_bridge.py
          python3 -m py_compile row-office-lok/integrate_cjk_font.py
          python3 -m py_compile row-office-port/patch_lo.py
          python3 -m py_compile row-office-browser/build-reborn-package-v2.py
          python3 -m py_compile row-office-browser/canonicalize-reborn-zip.py

      - name: Exercise gbuild and UNO script transforms
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          mkdir -p "$tmp/static/source/unoembindhelpers" "$tmp/desktop/source/app"
          cat > "$tmp/static/StaticLibrary_unoembind.mk" <<'EOF'
          $(eval $(call gb_StaticLibrary_StaticLibrary,unoembind))

          $(eval $(call gb_StaticLibrary_add_exception_objects,unoembind, \
              static/source/unoembindhelpers/PrimaryBindings \
          ))
          EOF
          cat > "$tmp/static/CustomTarget_emscripten_fs_image.mk" <<'EOF'
          gb_emscripten_fs_image_files := \
              $(INSTROOT)/$(LIBO_SHARE_FOLDER)/fonts/truetype/fc_local.conf \
              $(INSTROOT)/$(LIBO_SHARE_FOLDER)/gallery/fontwork.sdg \
          EOF
          cat > "$tmp/desktop/source/app/initjsunoscripting.cxx" <<'EOF'
          #if HAVE_EMSCRIPTEN_PROXY_TO_PTHREAD
          EM_JS(void, runUnoScriptUrls, (emscripten::EM_VAL handle), {
              globalThis.Module = globalThis.Module || Module;
              importScripts.apply(self, Emval.toValue(handle));
          });
          #else
          EM_JS(void, runUnoScriptUrls, (emscripten::EM_VAL handle), {
              const urls = Emval.toValue(handle);
              function step() {}
          });
          #endif
          EOF
          python3 row-office-lok/integrate_bridge.py "$tmp"
          python3 row-office-lok/integrate_cjk_font.py "$tmp"
          python3 - "$tmp" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          text = (root / 'static/StaticLibrary_unoembind.mk').read_text()
          assert '-I$(SRCDIR)/desktop/inc \\\n' in text
          assert 'static/source/unoembindhelpers/RowLokBridge \\\n' in text
          bridge = root / 'static/source/unoembindhelpers/RowLokBridge.cxx'
          assert bridge.is_file()
          assert 'RowLokDocument' in bridge.read_text()
          fs = (root / 'static/CustomTarget_emscripten_fs_image.mk').read_text()
          assert 'fonts/truetype/NotoSansCJK-Regular.ttc \\\n' in fs
          uno = (root / 'desktop/source/app/initjsunoscripting.cxx').read_text()
          assert '#elif defined ROW_EMSCRIPTEN_SINGLE_THREAD' in uno
          assert uno.count('#elif defined ROW_EMSCRIPTEN_SINGLE_THREAD') == 1
          assert 'importScripts.apply(self, Emval.toValue(handle))' in uno
          print(text)
          print(fs)
          print(uno)
          PY

      - name: Exercise exact pinned LibreOffice transform stack
        run: |
          set -euo pipefail
          python3 row-office-lok/integrate_bridge.py lo-transform-smoke
          python3 row-office-lok/integrate_cjk_font.py lo-transform-smoke
          python3 row-office-port/patch_lo.py lo-transform-smoke
          git -C lo-transform-smoke diff --check
          test "$(git -C lo-transform-smoke rev-parse HEAD)" = "31eabe1e534a70a2b7d5c39eb31e56a75c17be3b"
          grep -q 'ROW_EMSCRIPTEN_SINGLE_THREAD' lo-transform-smoke/solenv/gbuild/platform/EMSCRIPTEN_INTEL_GCC.mk
          grep -q '#elif defined ROW_EMSCRIPTEN_SINGLE_THREAD' lo-transform-smoke/desktop/source/app/initjsunoscripting.cxx
          grep -q 'importScripts.apply(self, Emval.toValue(handle))' lo-transform-smoke/desktop/source/app/initjsunoscripting.cxx
          grep -q 'static/source/unoembindhelpers/RowLokBridge' lo-transform-smoke/static/StaticLibrary_unoembind.mk
          grep -q 'NotoSansCJK-Regular.ttc' lo-transform-smoke/static/CustomTarget_emscripten_fs_image.mk
          grep -q 'threadPoolExecution' lo-transform-smoke/row-patch-report.json
          grep -q 'synchronous-inline' lo-transform-smoke/row-patch-report.json
          echo '--- exact-source diff stat ---'
          git -C lo-transform-smoke diff --stat
          echo '--- exact-source patch report ---'
          cat lo-transform-smoke/row-patch-report.json

      - name: Single-thread architecture guards
        run: |
          set -euo pipefail
          ! grep -R -nE 'new SharedArrayBuffer|Atomics\.' row-office-browser
          ! grep -R -nE 'PROXY_TO_PTHREAD|PThread\.pthreads' row-office-browser
          grep -q "new Worker" row-office-browser/row-office-client.js
          grep -q "sharedMemory" row-office-browser/row-office-thread.js
          grep -q "renderTile" row-office-browser/row-office-view.js
          grep -q "lok-callback" row-office-browser/row-office-view.js
          grep -q "compositionend" row-office-browser/row-office-view.js
          grep -q "dm\.readFile" row-office-browser/reborn-office.js
          grep -q "dm\.writeFile" row-office-browser/reborn-office.js
          grep -q "gb_StaticLibrary_add_exception_objects,unoembind" row-office-lok/integrate_bridge.py
          grep -q "rowLokProcessEventsToIdle" row-office-lok/row_lok_bridge.cxx
          grep -q "a2033d0e4e53f568c3f418a7d5d8c951af3f76c1" row-office-lok/prepare_cjk_font.sh
          grep -q -- "--disable-emscripten-proxy-to-pthread" row-office-port/build.sh
          grep -q "NotoSansCJK-Regular.ttc" row-office-lok/integrate_cjk_font.py

      - name: Exercise reproducible Reborn package contract
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          runtime="$tmp/runtime-tree"
          mkdir -p "$runtime/runtime" "$runtime/vendor" "$tmp/out1" "$tmp/out2"
          printf 'mock-js\n' > "$runtime/runtime/soffice.js"
          printf '\0asm-mock\n' > "$runtime/runtime/soffice.wasm"
          printf 'mock-data\n' > "$runtime/runtime/soffice.data"
          printf '{}\n' > "$runtime/runtime/soffice.data.js.metadata"
          printf 'globalThis.zetajsMock=true;\n' > "$runtime/vendor/zeta.js"
          cp row-office-browser/row-office-client.js "$runtime/"
          cp row-office-browser/row-office-view.js "$runtime/"
          cp row-office-browser/row-office-worker-loader.js "$runtime/"
          cp row-office-browser/row-office-thread.js "$runtime/"
          cp row-office-browser/reborn-office.js "$runtime/"

          for out in "$tmp/out1" "$tmp/out2"; do
            python3 row-office-browser/build-reborn-package-v2.py \
              "$runtime" "$out" --source-sha smoke --accepted
          done
          sha1=$(sha256sum "$tmp/out1/RebornOfficeWasm-browser-native.zip" | cut -d' ' -f1)
          sha2=$(sha256sum "$tmp/out2/RebornOfficeWasm-browser-native.zip" | cut -d' ' -f1)
          test "$sha1" = "$sha2"

          python3 - "$tmp/out1/RebornOfficeWasm-browser-native.zip" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import PurePosixPath
          path = sys.argv[1]
          with zipfile.ZipFile(path) as zf:
              names = zf.namelist()
              assert names[0] == 'RebornOfficeWasm/'
              seen = set()
              for name in names:
                  p = PurePosixPath(name.rstrip('/'))
                  parent = str(p.parent)
                  if name.endswith('/'):
                      if parent not in ('.', ''):
                          assert parent + '/' in seen, (parent, name)
                      seen.add(name)
                  elif parent not in ('.', ''):
                      assert parent + '/' in seen, (parent, name)
              launcher = json.loads(zf.read('RebornOfficeWasm/RebornOfficeWasm.exe'))
              assert 'apps.load' not in launcher['action']
              assert 'registerApp' in launcher['action']
              assert "C:/Program Files/RebornOfficeWasm" in launcher['action']
              icon = zf.read('RebornOfficeWasm/icon.png')
              assert icon.startswith(b'\x89PNG\r\n\x1a\n')
              manifest = json.loads(zf.read('RebornOfficeWasm/IMPORT-MANIFEST.json'))
              assert manifest['fileCount'] > 10
              release = json.loads(zf.read('RebornOfficeWasm/release.json'))
              assert release['browserAcceptancePassed'] is True
              assert release['sharedMemoryRequired'] is False
              assert zf.testzip() is None
          print('package sha256', hashlib.sha256(open(path, 'rb').read()).hexdigest())
          PY

      - name: Describe bridge footprint
        run: |
          mapfile -t files < <(find row-office-browser row-office-lok -type f ! -path '*/__pycache__/*' -print | sort)
          wc -c "${files[@]}"
          sha256sum "${files[@]}"
