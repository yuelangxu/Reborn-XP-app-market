name: Reborn Office LibreOffice core port

on:
  workflow_dispatch:
  push:
    branches: [row-office-core-port]
    paths:
      - '.github/workflows/row-office-core-port.yml'
      - 'row-office-port/**'

permissions:
  contents: read

jobs:
  build-writer-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Checkout port harness
        uses: actions/checkout@v4
        with:
          path: harness
          ref: row-office-core-port

      - name: Checkout pinned LibreOffice core
        uses: actions/checkout@v4
        with:
          repository: LibreOffice/core
          ref: 31eabe1e534a70a2b7d5c39eb31e56a75c17be3b
          path: libreoffice
          fetch-depth: 1

      - name: Build no-pthread headless Writer
        id: build
        continue-on-error: true
        env:
          SRC: ${{ github.workspace }}/libreoffice
          BUILD: ${{ github.workspace }}/lo-build
          TARBALLS: ${{ github.workspace }}/lo-tarballs
          PORT: ${{ github.workspace }}/harness/row-office-port
        run: bash harness/row-office-port/build.sh

      - name: Show first failure signals
        if: always()
        run: |
          echo '--- patch report ---'
          cat libreoffice/row-patch-report.json 2>/dev/null || true
          echo '--- build summary ---'
          cat lo-build/row-build-summary.json 2>/dev/null || true
          echo '--- tail ---'
          tail -n 250 lo-build/row-build.log 2>/dev/null || true
          echo '--- disk ---'
          df -h

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: row-office-core-port-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            libreoffice/row-patch-report.json
            libreoffice/config.log
            lo-build/config.log
            lo-build/row-build.log
            lo-build/row-build-summary.json
            lo-build/runtime-files.txt
            lo-build/soffice-inspection.json
            lo-build/ROW-soffice.wasm

      - name: Preserve failure state
        if: steps.build.outcome == 'failure'
        run: exit 1
