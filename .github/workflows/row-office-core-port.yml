name: Reborn Office LibreOffice core port

on:
  workflow_dispatch:
  push:
    branches: [row-office-core-port]
    paths:
      - '.github/workflows/row-office-core-port.yml'
      - 'row-office-port/**'

permissions:
  contents: read

jobs:
  build-writer-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Checkout port harness
        uses: actions/checkout@v4
        with:
          path: harness
          ref: row-office-core-port

      - name: Checkout pinned LibreOffice core
        uses: actions/checkout@v4
        with:
          repository: LibreOffice/core
          ref: 31eabe1e534a70a2b7d5c39eb31e56a75c17be3b
          path: libreoffice
          fetch-depth: 1

      - name: Restore builder-compatible Python 3.12
        id: python-cache
        uses: actions/cache/restore@v4
        with:
          path: row-python
          key: row-python-3.12.13-allotropia-wasm-v1

      - name: Download verified CPython source
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            https://www.python.org/ftp/python/3.12.13/Python-3.12.13.tgz \
            -o Python-3.12.13.tgz
          echo '0816c4761c97ecdb3f50a3924de0a93fd78cb63ee8e6c04201ddfaedca500b0b  Python-3.12.13.tgz' | sha256sum -c -

      - name: Build Python inside the WASM builder
        if: steps.python-cache.outputs.cache-hit != 'true'
        env:
          PREFIX: ${{ github.workspace }}/row-python
          SOURCE_ARCHIVE: ${{ github.workspace }}/Python-3.12.13.tgz
        run: bash harness/row-office-port/bootstrap_python.sh

      - name: Save builder-compatible Python 3.12
        if: steps.python-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: row-python
          key: row-python-3.12.13-allotropia-wasm-v1

      - name: Restore LibreOffice compiler cache
        uses: actions/cache/restore@v4
        with:
          path: lo-ccache
          key: row-lo-ccache-v1-${{ runner.os }}-31eabe1e-${{ github.run_id }}
          restore-keys: |
            row-lo-ccache-v1-${{ runner.os }}-31eabe1e-

      - name: Probe builder Python and browser
        run: |
          ./row-python/bin/python3 --version
          ldd ./row-python/bin/python3 || true
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version) 2>/dev/null || true

      - name: Build and accept no-pthread Writer runtime
        id: build
        continue-on-error: true
        env:
          SRC: ${{ github.workspace }}/libreoffice
          BUILD: ${{ github.workspace }}/lo-build
          TARBALLS: ${{ github.workspace }}/lo-tarballs
          PORT: ${{ github.workspace }}/harness/row-office-port
          HARNESS: ${{ github.workspace }}/harness
          HOST_PYTHON: ${{ github.workspace }}/row-python
          CCACHE_HOST_DIR: ${{ github.workspace }}/lo-ccache
        run: bash harness/row-office-port/build.sh

      - name: Show first failure signals
        if: always()
        run: |
          echo '--- patch report ---'
          cat libreoffice/row-patch-report.json 2>/dev/null || true
          echo '--- build summary ---'
          cat lo-build/row-build-summary.json 2>/dev/null || true
          echo '--- WASM inspection ---'
          cat lo-build/soffice-inspection.json 2>/dev/null || true
          echo '--- browser acceptance ---'
          grep -A 120 -B 2 'data-status=' lo-build/row-runtime-tree/row-acceptance-dom.txt 2>/dev/null || true
          echo '--- tail ---'
          tail -n 300 lo-build/row-build.log 2>/dev/null || true
          echo '--- disk ---'
          df -h

      - name: Save LibreOffice compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: lo-ccache
          key: row-lo-ccache-v1-${{ runner.os }}-31eabe1e-${{ github.run_id }}

      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: row-office-core-port-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            libreoffice/row-patch-report.json
            libreoffice/config.log
            lo-build/config.log
            lo-build/CONF-FOR-BUILD/config.log
            lo-build/row-build.log
            lo-build/row-build-summary.json
            lo-build/runtime-files.txt
            lo-build/soffice-inspection.json
            lo-build/ROW-soffice.wasm
            lo-build/row-acceptance-http.log
            lo-build/row-acceptance-chrome.log
            lo-build/row-runtime-tree/row-acceptance-dom.txt
            lo-build/row-third-party-licenses

      - name: Upload complete Reborn Office runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reborn-office-runtime
          retention-days: 14
          if-no-files-found: ignore
          compression-level: 0
          path: lo-build/row-runtime-tree

      - name: Preserve failure state
        if: steps.build.outcome == 'failure'
        run: exit 1
