name: Reborn Office release runner handoff

on:
  workflow_dispatch:
  push:
    branches: [row-office-runtime-probe]
    paths:
      - '.github/workflows/row-office-release-runner-handoff.yml'

permissions:
  contents: read

concurrency:
  group: row-office-core-port-refs/heads/row-office-core-port-prep
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Release gate takes priority; Run 28 already proved the unchanged core.'
