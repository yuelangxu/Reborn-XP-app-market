name: Reborn Office input render fix

on:
  push:
    branches:
      - row-office-input-render-fix
    paths:
      - '.github/workflows/row-office-input-render-fix.yml'
      - 'row-office-browser/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fixed browser layer
        uses: actions/checkout@v4

      - name: Download proven LibreOffice runtime from Run 28
        uses: actions/download-artifact@v4
        with:
          name: row-office-core-port-evidence
          path: evidence
          github-token: ${{ github.token }}
          run-id: 35040735653
          repository: yuelangxu/Reborn-XP-app-market

      - name: Assemble fixed runtime tree
        shell: bash
        run: |
          set -euo pipefail
          python3 row-office-browser/apply-input-render-fix-v2.py
          python3 row-office-browser/apply-input-render-fix-v3.py
          wasm=$(find evidence -type f -path '*/ROW-browser-runtime/runtime/soffice.wasm' -print -quit)
          test -n "$wasm"
          old_root=$(dirname "$(dirname "$wasm")")
          rm -rf current-runtime release-a release-b
          cp -a "$old_root" current-runtime
          for file in \
            acceptance.html \
            row-office-client.js \
            row-office-view.js \
            row-office-worker-loader.js \
            row-office-thread.js \
            reborn-office.js; do
            cp "row-office-browser/$file" "current-runtime/$file"
          done
          test -s current-runtime/runtime/soffice.js
          test -s current-runtime/runtime/soffice.wasm
          test -s current-runtime/runtime/soffice.data
          test -s current-runtime/runtime/soffice.data.js.metadata
          test -s current-runtime/vendor/zeta.js
          node --check current-runtime/row-office-view.js
          node --check current-runtime/row-office-client.js
          node --check current-runtime/row-office-thread.js
          ls -lh current-runtime/runtime/soffice.* current-runtime/vendor/zeta.js

      - name: Run real-browser input and rendering acceptance
        shell: bash
        run: |
          set -euo pipefail
          ROW_ACCEPTANCE_TIMEOUT_SECONDS=180 \
            bash row-office-browser/run-acceptance.sh current-runtime
          cat current-runtime/row-acceptance-result.json
          python3 - <<'PY'
          import json
          p = json.load(open('current-runtime/row-acceptance-result.json', encoding='utf-8'))
          assert p['status'] == 'pass', p
          names = {x['name'] for x in p['log']}
          required = {
              'ready', 'odt-roundtrip', 'docx-roundtrip',
              'lok-info', 'tile', 'lok-sync-caret', 'view-render-contract',
              'isolated-input-frame', 'iframe-keyboard', 'iframe-ime',
              'outside-page-guard'
          }
          missing = required - names
          assert not missing, f'missing acceptance probes: {sorted(missing)}'
          print('ROW input/render acceptance probes:', sorted(required))
          PY

      - name: Build deterministic Reborn XP package twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-a release-b
          for out in release-a release-b; do
            python3 row-office-browser/build-reborn-package-v2.py \
              current-runtime "$out" \
              --source-sha "${GITHUB_SHA}" \
              --accepted
          done
          sha_a=$(sha256sum release-a/RebornOfficeWasm-browser-native.zip | awk '{print $1}')
          sha_b=$(sha256sum release-b/RebornOfficeWasm-browser-native.zip | awk '{print $1}')
          test "$sha_a" = "$sha_b"
          cmp -s \
            release-a/RebornOfficeWasm-browser-native.zip \
            release-b/RebornOfficeWasm-browser-native.zip
          sha256sum release-a/RebornOfficeWasm-browser-native.zip \
            > release-a/RebornOfficeWasm-browser-native.zip.sha256
          echo "FINAL_SHA256=$sha_a" >> "$GITHUB_ENV"
          echo "Final package SHA256: $sha_a"

      - name: Verify package structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, zipfile
          from pathlib import PurePosixPath
          path = 'release-a/RebornOfficeWasm-browser-native.zip'
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              assert bad is None, bad
              names = z.namelist()
              required = [
                  'RebornOfficeWasm/',
                  'RebornOfficeWasm/runtime/',
                  'RebornOfficeWasm/vendor/',
                  'RebornOfficeWasm/runtime/soffice.js',
                  'RebornOfficeWasm/runtime/soffice.wasm',
                  'RebornOfficeWasm/runtime/soffice.data',
                  'RebornOfficeWasm/runtime/soffice.data.js.metadata',
                  'RebornOfficeWasm/vendor/zeta.js',
                  'RebornOfficeWasm/row-office-view.js',
                  'RebornOfficeWasm/reborn-office.js',
                  'RebornOfficeWasm/release.json',
                  'RebornOfficeWasm/IMPORT-MANIFEST.json',
                  'RebornOfficeWasm/SHA256SUMS.txt'
              ]
              for item in required:
                  assert item in names, item
              positions = {name: i for i, name in enumerate(names)}
              for name in names:
                  if name.endswith('/'):
                      continue
                  parent = str(PurePosixPath(name).parent) + '/'
                  if parent != './' and parent in positions:
                      assert positions[parent] < positions[name], (parent, name)
              release = json.loads(z.read('RebornOfficeWasm/release.json'))
              assert release.get('browserAcceptancePassed') is True, release
              assert release.get('sharedMemoryRequired') is False, release
              assert release.get('nativeBackendRequired') is False, release
              wasm = z.getinfo('RebornOfficeWasm/runtime/soffice.wasm')
              assert wasm.file_size > 100_000_000, wasm.file_size
              print(json.dumps({
                  'members': len(names),
                  'wasmBytes': wasm.file_size,
                  'sourceCommit': release.get('sourceCommit'),
                  'packageSha256': '${{ env.FINAL_SHA256 }}'
              }, indent=2))
          PY

      - name: Upload fixed Reborn Office candidate
        uses: actions/upload-artifact@v4
        with:
          name: RebornOfficeWasm-input-render-fix
          retention-days: 30
          if-no-files-found: error
          path: |
            release-a/RebornOfficeWasm-browser-native.zip
            release-a/RebornOfficeWasm-browser-native.zip.sha256
            current-runtime/row-acceptance-result.json
            current-runtime/row-acceptance-chrome.log
            current-runtime/row-acceptance-http.log
